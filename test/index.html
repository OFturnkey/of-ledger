<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O F Turnkey TEST</title>
<meta name="description" content="O F Turnkey test app">
<meta name="theme-color" content="#1C1E1D">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<script>
  // Test launcher: signs the person in with Google, then opens the TEST app with the sign-in token.
  // The live launcher (one folder up) is not affected.
  var CLIENT_ID = '174226011711-g53cncop1stgb4vsmt5ia4j0qfsluc25.apps.googleusercontent.com';
  var APP = 'https://script.google.com/macros/s/AKfycbz2P0G5dOAN5jTFEa7UOEntbASpUndzLT40vQ9DdWQY56hyqqNlOAqagscpfLqp1Q599A/exec';
  var params = new URLSearchParams(location.search);
  var switching = params.has('switch');
  var tab = /^(tasks|ledger|dir)$/.test(params.get('tab') || '') ? params.get('tab') : '';
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #1C1E1D; color: #FFFFFF;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; line-height: 1.5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  main { width: 100%; max-width: 460px; }
  .test { display: inline-block; margin-bottom: 18px; background: #FFEDB3; color: #5E4500; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; border-radius: 999px; padding: 3px 12px; }
  .logo { width: 112px; height: 112px; border-radius: 26px; display: block; margin: 0 auto 18px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 700; letter-spacing: 0.02em; }
  .status { margin: 0 0 24px; color: #B9BDB9; font-size: 15px; min-height: 1.5em; }
  .status.err { color: #FFB4AB; }
  .gbtn { display: flex; justify-content: center; min-height: 48px; }
  .ghost {
    margin-top: 16px; background: transparent; color: #FFFFFF; border: 1px solid #8A8F8B; border-radius: 10px;
    font: inherit; font-weight: 600; padding: 12px 22px; min-height: 48px; cursor: pointer;
  }
  .ghost:focus-visible, a:focus-visible { outline: 3px solid #DDE8C9; outline-offset: 3px; }
  .note { margin: 22px auto 0; max-width: 420px; color: #B9BDB9; font-size: 14px; }
  .note a { color: #DDE8C9; }
</style>
</head>
<body>
  <main>
    <span class="test">TEST</span>
    <img class="logo" src="../icons/icon-512.png" alt="O F Turnkey logo: a white key on black">
    <h1>O F Turnkey</h1>
    <p class="status" id="status" role="status" aria-live="polite">Getting sign-in ready…</p>
    <div class="gbtn" id="gbtn"></div>
    <div><button type="button" class="ghost" id="install" hidden>Install test app</button></div>
    <p class="note">Test version. Sign in with the Google account you use for O F Turnkey. <a href="../privacy.html">Privacy</a></p>
  </main>
<script>
  function say(text, isErr) {
    var el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status' + (isErr ? ' err' : '');
  }
  function openApp(credential) {
    say('Signed in. Opening O F Turnkey…');
    location.replace(APP + '?t=' + encodeURIComponent(credential) + (tab ? '&tab=' + tab : ''));
  }
  function gisReady() {
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: function (res) { openApp(res.credential); },
      auto_select: !switching,
      cancel_on_tap_outside: false,
      context: 'signin',
      itp_support: true,
      use_fedcm_for_prompt: true,
      use_fedcm_for_button: true
    });
    if (switching) google.accounts.id.disableAutoSelect();
    google.accounts.id.renderButton(document.getElementById('gbtn'), {
      type: 'standard', theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', logo_alignment: 'left', width: 300
    });
    say(switching ? 'Choose the account to use.' : 'Sign in with your Google account.');
    if (!switching) google.accounts.id.prompt();
  }
  function gisFailed() { say('Couldn’t reach Google. Check your connection, then reload this page.', true); }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(function () {});
  var deferred = null;
  var installBtn = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; installBtn.hidden = false; });
  installBtn.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.finally(function () { deferred = null; installBtn.hidden = true; });
  });
</script>
<script src="https://accounts.google.com/gsi/client" async onload="gisReady()" onerror="gisFailed()"></script>
</body>
</html>
